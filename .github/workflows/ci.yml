name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: API — build & test (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore src/PhoneBook.sln
      - name: Build (Release)
        run: dotnet build src/PhoneBook.sln --no-restore -c Release
      - name: Unit + integration tests (SQLite in-memory)
        run: dotnet test src/PhoneBook.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: src/server.Tests/TestResults
          retention-days: 7

  client:
    name: Web — test & build (Angular 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: src/client/dist/phonebook-web/browser
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    env:
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
