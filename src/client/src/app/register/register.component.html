<div class="register-container">
    <div class="register-card">
      <h2>Create Account</h2>
      <p>Sign up to get started</p>
  
      <form (ngSubmit)="onRegister()" #registerForm="ngForm">
        <input type="text" name="name" [(ngModel)]="name" placeholder="Full Name" required />
        <input type="text" name="UserName" [(ngModel)]="username" placeholder="User Name" required />
        <input type="password" name="password" [(ngModel)]="password" placeholder="Password" required />
        
        <button type="submit">Register</button>
      </form>
  
      <p class="login-link">
        Already have an account? <a routerLink="/Login">Login here</a>
      </p>
    </div>
  </div>
