<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhoneBook</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PhoneBook: your contacts, labelled phone numbers, groups and vCard import/export.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { if (localStorage.getItem('phonebook.theme') === 'dark' || (!localStorage.getItem('phonebook.theme') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
